# The BRB server (Go): gofmt, vet and tests, only when it changes.
name: BRB server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

concurrency:
  group: brb-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: BRB server (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/stay-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/stay-live/go.mod
          cache-dependency-path: server/stay-live/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet and test
        run: go vet ./... && go test -count=1 ./...
