# The bonding bench: our sender against real SRTLA receivers over three tc-netem-shaped links (bench/netem), each
# scenario repeated with several seeds, medians posted to the job summary next to bench/baseline.json.
# Weekly and on demand. Report only: nothing here fails on a worse number until run-to-run noise is known.
name: Bonding bench (netem)

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      seeds:
        description: "Runs per scenario and receiver (3-5)"
        default: "3"
      receivers:
        description: "Receivers, space-separated (belabox staylive irlserver openirl)"
        default: "belabox staylive"
      duration:
        description: "Seconds per run"
        default: "60"

permissions:
  contents: read

concurrency:
  group: bonding-bench
  cancel-in-progress: false

jobs:
  scenario:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: [aggregate, lossy, kill-one, uplink-dead, tunnel, stepdown, handover, gilbert, skew]
    env:
      SEEDS: ${{ github.event.inputs.seeds || '3' }}
      RECEIVERS: ${{ github.event.inputs.receivers || 'belabox staylive' }}
      DURATION: ${{ github.event.inputs.duration || '60' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Load netem
        run: sudo modprobe sch_netem || true
      - name: Run
        run: |
          for rx in $RECEIVERS; do
            for seed in $(seq 1 "$SEEDS"); do
              # The CLI's encoder-shaped source with the bitrate controller on: the closed loop the app runs.
              SEED=$seed SOURCE=synth ABR=balanced GRADLE="./gradlew --no-daemon" \
                bench/netem/run.sh "$rx" "${{ matrix.scenario }}" "$DURATION" \
                || echo "::warning::$rx ${{ matrix.scenario }} seed $seed did not finish"
            done
          done
      - name: Keep the small files
        if: always()
        run: find bench/netem/results -name received.ts -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netem-${{ matrix.scenario }}
          path: bench/netem/results/
          retention-days: 30

  report:
    needs: scenario
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: netem-*
          path: results
      - name: Medians against the baseline
        run: |
          files=$(find results -name result.json)
          if [ -z "$files" ]; then echo "No runs finished." >> "$GITHUB_STEP_SUMMARY"; echo '{"groups":{}}' > medians.json; exit 0; fi
          python3 bench/netem/report.py --baseline bench/baseline.json --json medians.json $files >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: netem-medians
          path: medians.json
          retention-days: 90
