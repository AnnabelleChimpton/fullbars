# The SRTLA sender library (srtla-kt), only when it changes.
name: Bonding library

on:
  push:
    branches: [main]
    paths:
      - "srtla-kt/**"
      - ".github/workflows/srtla.yml"
  pull_request:
    paths:
      - "srtla-kt/**"
      - ".github/workflows/srtla.yml"

permissions:
  contents: read

concurrency:
  group: bonding-library-${{ github.ref }}
  cancel-in-progress: true

jobs:
  srtla:
    name: Bonding library (srtla-kt)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: srtla-kt
        run: ./gradlew --no-daemon test
